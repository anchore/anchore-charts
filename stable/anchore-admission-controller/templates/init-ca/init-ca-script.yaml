apiVersion: v1
kind: ConfigMap
metadata:
  name: {{.Release.Name}}-init-ca
  labels:
    app: {{ template "anchore-admission-controller.fullname" . }}
  annotations:
    "helm.sh/hook": {{ include "anchore-admission-controller.initCaHookPhases" . }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  init-ca.sh: |-
    #!/bin/bash -xe
    # Adapted from https://github.com/openshift/kubernetes-namespace-reservation/blob/master/hack/install-kube.sh
    mkdir /tmp/.bin
    export PATH=$PATH:/tmp/.bin
    cd /tmp/.bin

    # Match the downloaded binaries to the node architecture (amd64/arm64).
    case "$(uname -m)" in
      x86_64) ARCH=amd64 ;;
      aarch64|arm64) ARCH=arm64 ;;
      *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
    esac

    curl -L -o jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-${ARCH}
    chmod +x jq
    curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/${ARCH}/kubectl
    chmod +x ./kubectl

    # creates a client CA, args are sudo, dest-dir, ca-id, purpose
    # purpose is dropped in after "key encipherment", you usually want
    # '"client auth"'
    # '"server auth"'
    # '"client auth","server auth"'
    function kube::util::create_signing_certkey {
        local sudo=$1
        local dest_dir=$2
        local id=$3
        local purpose=$4
        # Create client ca
        ${sudo} /bin/bash -e <<EOF
        rm -f "${dest_dir}/${id}-ca.crt" "${dest_dir}/${id}-ca.key"
        openssl req -x509 -sha256 -new -nodes -days {{ .Values.initCa.caDays | default 3650 }} -newkey rsa:2048 -keyout "${dest_dir}/${id}-ca.key" -out "${dest_dir}/${id}-ca.crt" -subj "/C=xx/ST=x/L=x/O=x/OU=x/CN=ca/emailAddress=x/"
        echo '{"signing":{"default":{"expiry":"{{ mul (int (.Values.initCa.certDays | default 3650)) 24 }}h","usages":["signing","key encipherment",${purpose}]}}}' > "${dest_dir}/${id}-ca-config.json"
    EOF
    }

    # signs a serving certificate: args are sudo, dest-dir, ca, filename (roughly), subject, hosts...
    function kube::util::create_serving_certkey {
        local sudo=$1
        local dest_dir=$2
        local ca=$3
        local id=$4
        local cn=${5:-$4}
        local hosts=""
        local SEP=""
        shift 5
        while [ -n "${1:-}" ]; do
            hosts+="${SEP}\"$1\""
            SEP=","
            shift 1
        done
        ${sudo} /bin/bash -e <<EOF
        cd ${dest_dir}
        echo '{"CN":"${cn}","hosts":[${hosts}],"key":{"algo":"rsa","size":2048}}' | cfssl gencert -ca=${ca}.crt -ca-key=${ca}.key -config=${ca}-config.json - | cfssljson -bare serving-${id}
        mv "serving-${id}-key.pem" "serving-${id}.key"
        mv "serving-${id}.pem" "serving-${id}.crt"
        rm -f "serving-${id}.csr"
    EOF
    }

    which jq &>/dev/null || { echo "Please install jq (https://stedolan.github.io/jq/)."; exit 1; }
    which cfssljson &>/dev/null || { echo "Please install cfssljson (https://github.com/cloudflare/cfssl))."; exit 1; }

    # Idempotency: on upgrade, skip regeneration if the existing APIService
    # caBundle still has >{{ .Values.initCa.renewBeforeDays | default 30 }} days of validity. This lets the
    # hook run on every helm upgrade without churning certs. The APIService
    # caBundle is the source of truth - the leaf serving cert in the Secret
    # may outlive its CA, so the Secret alone is not safe to check.
    APISERVICE_NAME={{ .Values.apiService.version }}.{{ .Values.apiService.group }}
    EXISTING_CA_B64=$(kubectl get apiservice "$APISERVICE_NAME" -o jsonpath='{.spec.caBundle}' 2>/dev/null || true)
    if [ -n "$EXISTING_CA_B64" ]; then
      echo "$EXISTING_CA_B64" | base64 -d > /tmp/existing-ca.crt 2>/dev/null || true
      RENEW_SECS=$(( {{ .Values.initCa.renewBeforeDays | default 30 }} * 24 * 3600 ))
      if [ -s /tmp/existing-ca.crt ] && openssl x509 -in /tmp/existing-ca.crt -noout -checkend "$RENEW_SECS" 2>/dev/null; then
        echo "Existing APIService caBundle has >{{ .Values.initCa.renewBeforeDays | default 30 }}d of validity; skipping regeneration."
        exit 0
      fi
      echo "Existing APIService caBundle is missing, expired, or expires within {{ .Values.initCa.renewBeforeDays | default 30 }}d; regenerating."
    else
      echo "No existing APIService caBundle; generating fresh CA and cert."
    fi

    # create necessary TLS certificates:
    # - a local CA key and cert
    # - a webhook server key and cert signed by the local CA
    rm -rf ./_output/
    CERT_DIR=_output/tmp/certs
    mkdir -p "${CERT_DIR}"
    kube::util::create_signing_certkey "" "${CERT_DIR}" serving '"server auth"'

    # create webhook server key and cert
    kube::util::create_serving_certkey "" "${CERT_DIR}" "serving-ca" {{ template "anchore-admission-controller.fullname" . }}.{{ .Release.Namespace }}.svc "{{ template "anchore-admission-controller.fullname" . }}.{{ .Release.Namespace }}.svc" "{{ template "anchore-admission-controller.fullname" . }}.{{ .Release.Namespace }}.svc"

    cat > secret.yaml <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: {{ template "anchore-admission-controller.name" . }}-certs
    type: kubernetes.io/tls
    data:
      tls.crt: TLS_SERVING_CERT
      tls.key: TLS_SERVING_KEY
    EOF

    sed "s/TLS_SERVING_CERT/$(base64 ${CERT_DIR}/serving-{{ template "anchore-admission-controller.fullname" . }}.{{ .Release.Namespace }}.svc.crt | tr -d '\n')/g" secret.yaml |
      sed "s/TLS_SERVING_KEY/$(base64 ${CERT_DIR}/serving-{{ template "anchore-admission-controller.fullname" . }}.{{ .Release.Namespace }}.svc.key | tr -d '\n')/g" | kubectl -n {{ .Release.Namespace }} apply -f -

    cat > api-service.yaml <<EOF
    apiVersion: apiregistration.k8s.io/v1
    kind: APIService
    metadata:
      name: {{ .Values.apiService.version }}.{{ .Values.apiService.group }}
    spec:
      caBundle: SERVICE_SERVING_CERT_CA
      group: {{ .Values.apiService.group }}
      groupPriorityMinimum: 1000
      versionPriority: 15
      service:
        name: {{ template "anchore-admission-controller.fullname" . }}
        namespace: {{ .Release.Namespace }}
      version: {{ .Values.apiService.version }}
    EOF

    sed "s/SERVICE_SERVING_CERT_CA/$(base64 ${CERT_DIR}/serving-ca.crt | tr -d '\n')/g" api-service.yaml | kubectl -n {{ .Release.Namespace }} apply -f -
