## global.imageRegistryHost supplies the registry for any image value that states none of its own.
## An image value that does state one - a dict with `registry`, or a string that already includes a
## registry host - keeps it, so a single image can be pointed at a different mirror than the rest.
suite: Global Image Registry Tests
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 9.9.9
  appVersion: 9.9.9

tests:
  - it: should render the shipped default through docker.io
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/anchore/kubernetes-admission-controller:v0.8.5"

  - it: should supply the registry from the global
    template: deployment.yaml
    documentIndex: 0
    set:
      global.imageRegistryHost: harbor.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.example.com/anchore/kubernetes-admission-controller:v0.8.5"

  - it: should support a registry host that includes a path
    template: deployment.yaml
    documentIndex: 0
    set:
      global.imageRegistryHost: harbor.example.com/anchore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.example.com/anchore/anchore/kubernetes-admission-controller:v0.8.5"

  - it: should not double the slash when the registry host has a trailing one
    template: deployment.yaml
    documentIndex: 0
    set:
      global.imageRegistryHost: harbor.example.com/
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.example.com/anchore/kubernetes-admission-controller:v0.8.5"

  - it: should keep a registry the image states itself
    template: deployment.yaml
    documentIndex: 0
    set:
      global.imageRegistryHost: harbor.example.com
      image.registry: myregistry.local
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myregistry.local/anchore/kubernetes-admission-controller:v0.8.5"

  - it: should keep a complete reference given as a string
    template: deployment.yaml
    documentIndex: 0
    set:
      global.imageRegistryHost: harbor.example.com
      image: myregistry.local/anchore/thing:v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myregistry.local/anchore/thing:v9.9.9"

  - it: should supply the registry for a string that states none
    template: deployment.yaml
    documentIndex: 0
    set:
      global.imageRegistryHost: harbor.example.com
      image: anchore/thing:v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "harbor.example.com/anchore/thing:v9.9.9"

  ## Guards the ordering: these charts ship no digest today, so a digest only appears if a user sets
  ## one or a future default pins one. Helm merges a user's `tag` into that default rather than
  ## replacing it, so digest-precedence here would make `image.tag` a silent no-op.
  - it: should prefer a tag over a digest when both are set
    template: deployment.yaml
    documentIndex: 0
    set:
      image.digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/anchore/kubernetes-admission-controller:v0.8.5"
