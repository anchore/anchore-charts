suite: Termination grace period
# On SIGTERM a service stops taking new work and finishes what it has. The analyzer needs
# far longer than the Kubernetes default of 30s, since an image analysis runs for minutes.
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 9.9.9
  appVersion: 9.9.9
set:
  postgresql.externalEndpoint: test-postgresql
  postgresql.auth.username: test-user
  postgresql.auth.password: test-password
  postgresql.auth.database: test-db
tests:
  - it: should default every service to the kubernetes default
    template: templates/api_deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: should give the analyzer long enough to finish an analysis
    template: templates/analyzer_deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600

  - it: should let the global value be overridden per service
    template: templates/api_deployment.yaml
    documentIndex: 0
    set:
      terminationGracePeriodSeconds: 45
      api.terminationGracePeriodSeconds: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: should apply the global value to services with no override
    template: templates/catalog_deployment.yaml
    documentIndex: 0
    set:
      terminationGracePeriodSeconds: 90
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  - it: should keep the analyzer override when the global value changes
    template: templates/analyzer_deployment.yaml
    documentIndex: 0
    set:
      terminationGracePeriodSeconds: 45
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
