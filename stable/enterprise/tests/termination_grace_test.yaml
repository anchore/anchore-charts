suite: Termination grace period
# Anchore services do not drain on SIGTERM yet, so every service stays at the Kubernetes
# default; raising it would only slow pod deletion down. The plumbing is here so it can be
# raised per service once they do drain.
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 9.9.9
  appVersion: 9.9.9
set:
  postgresql.externalEndpoint: test-postgresql
  postgresql.auth.username: test-user
  postgresql.auth.password: test-password
  postgresql.auth.database: test-db
tests:
  - it: should default every service to the kubernetes default
    template: templates/api_deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: should leave the analyzer at the default until analyzers drain on SIGTERM
    template: templates/analyzer_deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: should let the global value be overridden per service
    template: templates/api_deployment.yaml
    documentIndex: 0
    set:
      terminationGracePeriodSeconds: 45
      api.terminationGracePeriodSeconds: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: should apply the global value to services with no override
    template: templates/catalog_deployment.yaml
    documentIndex: 0
    set:
      terminationGracePeriodSeconds: 90
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  - it: should allow the analyzer to be raised on its own
    template: templates/analyzer_deployment.yaml
    documentIndex: 0
    set:
      analyzer.terminationGracePeriodSeconds: 600
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
