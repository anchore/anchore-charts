suite: Database Encryption at Rest Tests
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 9.9.9
  appVersion: 9.9.9
set:
  postgresql.externalEndpoint: test-postgresql
  postgresql.auth.username: test-user
  postgresql.auth.password: test-password
  postgresql.auth.database: test-db
  # Default suite-level key so the validator passes; individual tests override
  # this (set to "" or set disable_db_encryption_unsafe) when exercising the
  # validator or the disable path.
  anchoreConfig.database.encryption.currentKey: DEFAULT_TEST_KEY

tests:
  # Validation tests live in db_encryption_validation_test.yaml so the suite-level
  # currentKey default below doesn't shadow the "no keys" scenarios.

  # --- Chart-managed secret (inline keys) -----------------------------------

  - it: should create db-encryption-keys secret when currentKey is set inline
    templates:
      - db_encryption_secret.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
      anchoreConfig.database.encryption.previousKey: PREVIOUS_KEY_VALUE
    asserts:
      - equal:
          path: metadata.name
          value: test-release-enterprise-db-encryption-keys
      - equal:
          path: stringData.current_key
          value: CURRENT_KEY_VALUE
      - equal:
          path: stringData.previous_key
          value: PREVIOUS_KEY_VALUE

  - it: should create db-encryption-keys secret with only current_key when previousKey is empty
    templates:
      - db_encryption_secret.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
    asserts:
      - equal:
          path: stringData.current_key
          value: CURRENT_KEY_VALUE
      - isNull:
          path: stringData.previous_key

  - it: should not create db-encryption-keys secret when existingSecret is set
    templates:
      - db_encryption_secret.yaml
    set:
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
      anchoreConfig.database.encryption.existingSecret: user-managed-keys
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create db-encryption-keys secret when useExistingSecrets is true
    templates:
      - db_encryption_secret.yaml
    set:
      useExistingSecrets: true
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create db-encryption-keys secret when disable_db_encryption_unsafe is true
    templates:
      - db_encryption_secret.yaml
    set:
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
      anchoreConfig.database.disable_db_encryption_unsafe: true
    asserts:
      - hasDocuments:
          count: 0

  # --- Deployment env vars (chart-managed secret path) ----------------------

  - it: should inject db encryption env vars from chart-managed secret with currentKey first
    templates:
      - analyzer_deployment.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
      anchoreConfig.database.encryption.previousKey: PREVIOUS_KEY_VALUE
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
            valueFrom:
              secretKeyRef:
                name: test-release-enterprise-db-encryption-keys
                key: current_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS
            valueFrom:
              secretKeyRef:
                name: test-release-enterprise-db-encryption-keys
                key: previous_key
                optional: true

  - it: should omit previous key env var when only currentKey is set inline
    templates:
      - api_deployment.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
            valueFrom:
              secretKeyRef:
                name: test-release-enterprise-db-encryption-keys
                key: current_key
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS
            valueFrom:
              secretKeyRef:
                name: test-release-enterprise-db-encryption-keys
                key: previous_key
                optional: true

  # --- Deployment env vars (existingSecret path) ----------------------------

  - it: should reference existingSecret in env vars when set
    templates:
      - analyzer_deployment.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.existingSecret: user-managed-keys
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
            valueFrom:
              secretKeyRef:
                name: user-managed-keys
                key: current_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS
            valueFrom:
              secretKeyRef:
                name: user-managed-keys
                key: previous_key
                optional: true

  - it: should honor custom secret key names when existingSecret uses non-default keys
    templates:
      - api_deployment.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.existingSecret: user-managed-keys
      anchoreConfig.database.encryption.currentKeySecretKey: my_current
      anchoreConfig.database.encryption.previousKeySecretKey: my_previous
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
            valueFrom:
              secretKeyRef:
                name: user-managed-keys
                key: my_current
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS
            valueFrom:
              secretKeyRef:
                name: user-managed-keys
                key: my_previous
                optional: true

  # --- useExistingSecrets path ---------------------------------------------

  - it: should not emit env vars when useExistingSecrets is true and no encryption.* values set
    templates:
      - analyzer_deployment.yaml
    documentIndex: 0
    set:
      useExistingSecrets: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS
          any: true

  - it: should not emit env vars when useExistingSecrets is true and only currentKey is set
    templates:
      - analyzer_deployment.yaml
    documentIndex: 0
    set:
      useExistingSecrets: true
      anchoreConfig.database.encryption.currentKey: SHOULD_BE_IGNORED
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
          any: true

  - it: should emit env vars referencing existingSecret even when useExistingSecrets is true
    templates:
      - analyzer_deployment.yaml
    documentIndex: 0
    set:
      useExistingSecrets: true
      anchoreConfig.database.encryption.existingSecret: user-managed-keys
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
            valueFrom:
              secretKeyRef:
                name: user-managed-keys
                key: current_key

  # --- disable_db_encryption_unsafe path ------------------------------------

  - it: should not emit env vars when disable_db_encryption_unsafe is true
    templates:
      - analyzer_deployment.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.currentKey: SHOULD_BE_IGNORED
      anchoreConfig.database.disable_db_encryption_unsafe: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_CURRENT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS
          any: true

  # --- Rendered config (default_config.yaml / osaa_config.yaml) ------------

  - it: should render encryption keys list with current first in default_config.yaml
    templates:
      - anchore_configmap.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "keys:\\s*\\n\\s*- \\$\\{ANCHORE_DB_ENCRYPTION_KEY_CURRENT\\}\\s*\\n\\s*- \\$\\{ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS\\}"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "disable_db_encryption_unsafe: false"

  - it: should render encryption keys list with current first in osaa_config.yaml
    templates:
      - osaa_configmap.yaml
    documentIndex: 0
    set:
      osaaMigrationJob.enabled: true
      anchoreConfig.database.encryption.currentKey: CURRENT_KEY_VALUE
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "keys:\\s*\\n\\s*- \\$\\{ANCHORE_DB_ENCRYPTION_KEY_CURRENT\\}\\s*\\n\\s*- \\$\\{ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS\\}"

  - it: should omit keys list in default_config.yaml when disable_db_encryption_unsafe is true
    templates:
      - anchore_configmap.yaml
    documentIndex: 0
    set:
      anchoreConfig.database.disable_db_encryption_unsafe: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "ANCHORE_DB_ENCRYPTION_KEY_CURRENT"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "ANCHORE_DB_ENCRYPTION_KEY_PREVIOUS"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "disable_db_encryption_unsafe: true"

  - it: should omit keys list in osaa_config.yaml when disable_db_encryption_unsafe is true
    templates:
      - osaa_configmap.yaml
    documentIndex: 0
    set:
      osaaMigrationJob.enabled: true
      anchoreConfig.database.disable_db_encryption_unsafe: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "ANCHORE_DB_ENCRYPTION_KEY_CURRENT"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "disable_db_encryption_unsafe: true"
