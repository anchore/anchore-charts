suite: NG Config Tests
templates:
  - templates/configmaps/componentcatalog_configmap.yaml
values:
  - values.yaml
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 9.9.9
  appVersion: 9.9.9
set:
  postgresql.externalEndpoint: test-postgresql
  postgresql.auth.username: test-user
  postgresql.auth.password: test-password
  postgresql.auth.database: test-db
tests:
  # ── NG Server ──────────────────────────────────────────────────────────
  - it: should use global server defaults when no component override is set
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "process_worker_count: 1"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "timeout_keep_alive: 5"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_enable: false"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_cert: false"

  - it: should allow a component to override an existing server field
    documentIndex: 0
    set:
      anchoreConfig.component_catalog.server.process_worker_count: 8
      anchoreConfig.component_catalog.server.timeout_keep_alive: 30
    asserts:
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "process_worker_count: 8"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "timeout_keep_alive: 30"
      # ssl fields should still come from global server defaults
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_enable: false"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_cert: false"

  - it: should merge a partial component server override with global server defaults
    documentIndex: 0
    set:
      # component only overrides one field — all other ng fields should come from global server
      anchoreConfig.component_catalog.server.process_worker_count: 4
    asserts:
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "process_worker_count: 4"
      # remaining fields inherit from global server
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "timeout_keep_alive: 5"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_enable: false"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_cert: false"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_chain: false"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_key: false"

  - it: should not pass through unknown server fields from a component override
    documentIndex: 0
    set:
      anchoreConfig.component_catalog.server.completely_new_field: some_value
    asserts:
      # unknown field should not appear in output
      - notMatchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "completely_new_field"
      # global defaults still present
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "process_worker_count: 1"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "timeout_keep_alive: 5"
      - matchRegex:
          path: data["bootstrap_ng.yaml"]
          pattern: "ssl_enable: false"

  # ── NG Logging ─────────────────────────────────────────────────────────
  - it: should use global logging defaults for ng logging when no component override is set
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "colored_logging: false"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "structured_logging: false"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "file_retention_rule: 10"
      # legacy-only fields should not appear
      - notMatchRegex:
          path: data["config_ng.yaml"]
          pattern: "server_access_logging"
      - notMatchRegex:
          path: data["config_ng.yaml"]
          pattern: "server_response_debug_logging"
      - notMatchRegex:
          path: data["config_ng.yaml"]
          pattern: "server_log_level"

  - it: should allow a component to override an existing logging field
    documentIndex: 1
    set:
      anchoreConfig.component_catalog.logging.structured_logging: true
      anchoreConfig.component_catalog.logging.colored_logging: true
    asserts:
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "structured_logging: true"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "colored_logging: true"
      # other ng fields still from global
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "file_retention_rule: 10"

  - it: should merge a partial component logging override with global logging defaults
    documentIndex: 1
    set:
      anchoreConfig.component_catalog.logging.structured_logging: true
    asserts:
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "structured_logging: true"
      # remaining fields inherit from global logging
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "colored_logging: false"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "exception_backtrace_logging: false"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "exception_diagnose_logging: false"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "file_rotation_rule: 10 MB"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "file_retention_rule: 10"

  - it: should not pass through legacy-only logging fields from a component override
    documentIndex: 1
    set:
      anchoreConfig.component_catalog.logging.server_access_logging: true
    asserts:
      - notMatchRegex:
          path: data["config_ng.yaml"]
          pattern: "server_access_logging"
      # ng defaults still present
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "colored_logging: false"
      - matchRegex:
          path: data["config_ng.yaml"]
          pattern: "structured_logging: false"
