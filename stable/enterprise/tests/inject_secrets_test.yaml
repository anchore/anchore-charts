suite: injectSecretsViaEnv behavior
# Under injectSecretsViaEnv=true the chart must NOT create k8s Secrets (creds are injected
# externally, e.g. Vault/External-Secrets via extraEnv), and the DB-connecting hook jobs must
# still receive creds through extraEnv (via common.environment) rather than hanging.
set:
  postgresql.externalEndpoint: test-postgresql
  postgresql.auth.username: test-user
  postgresql.auth.password: test-password
  postgresql.auth.database: test-db
tests:
  - it: does NOT create the main anchore secret under injectSecretsViaEnv
    template: templates/anchore_secret.yaml
    set:
      injectSecretsViaEnv: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does NOT create the ui secret under injectSecretsViaEnv
    template: templates/ui_secret.yaml
    set:
      injectSecretsViaEnv: true
    asserts:
      - hasDocuments:
          count: 0

  - it: still creates the main secret in the default (chart-managed) mode
    template: templates/anchore_secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: skips the smoke test under injectSecretsViaEnv (its secretKeyRef would dangle)
    template: templates/tests/anchorectl_smoketest.yaml
    set:
      injectSecretsViaEnv: true
    asserts:
      - hasDocuments:
          count: 0

  - it: pre-install DB check receives extraEnv creds under injectSecretsViaEnv (no empty CONNSTR)
    template: templates/hooks/pre-install/pre_install_job.yaml
    documentIndex: 0
    set:
      injectSecretsViaEnv: true
      extraEnv:
        - name: ANCHORE_DB_HOST
          value: injected-db-host
    asserts:
      # common.environment renders the user's extraEnv onto the wait-for-db container
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANCHORE_DB_HOST
            value: injected-db-host

  - it: pre-install job can be disabled
    template: templates/hooks/pre-install/pre_install_job.yaml
    set:
      preInstallJob.enabled: false
    asserts:
      - hasDocuments:
          count: 0
