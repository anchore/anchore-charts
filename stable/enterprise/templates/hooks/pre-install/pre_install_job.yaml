{{- $component := "preInstallJob" -}}
{{- if .Values.preInstallJob.enabled -}}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "enterprise.preInstallJob.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Fail the hook outright once the pod's own retry budget is exhausted;
  # do not let Kubernetes spin up fresh pods to retry (default backoffLimit
  # is 6, which would multiply the wait budget several times over).
  backoffLimit: 0
  {{- if ne (.Values.preInstallJob.ttlSecondsAfterFinished | quote) (-1 | quote) }}
  ttlSecondsAfterFinished: {{ .Values.preInstallJob.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      name: {{ template "enterprise.preInstallJob.fullname" . }}
      labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 8 }}
      annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 8 }}
    spec:
      {{- include "enterprise.common.podSpec" (merge (dict "component" $component) .) | indent 6 }}
      {{- include "enterprise.common.hostAliases" (merge (dict "component" $component) .) | nindent 6 }}
      restartPolicy: Never
      volumes: {{- include "enterprise.common.extraVolumes" (merge (dict "component" $component) .) | nindent 8 }}
        - name: config-volume
          configMap:
            name: {{ template "enterprise.hooks.fullname" . }}-config
      {{- with .Values.certStoreSecretName }}
        - name: certs
          secret:
            secretName: {{ . }}
      {{- end }}
      {{- if .Values.cloudsql.useExistingServiceAcc }}
        - name: {{ .Values.cloudsql.serviceAccSecretName }}
          secret:
            secretName: {{ .Values.cloudsql.serviceAccSecretName }}
      {{- end }}
      {{- if eq (include "enterprise.common.readOnlyRootFilesystem" (merge (dict "component" $component) .)) "true" }}
      {{- include "enterprise.common.writableVolumes" (merge (dict "component" $component) .) | nindent 8 }}
      {{- end }}
      {{- if or
            (and .Values.cloudsql.enabled .Values.cloudsql.useSideCar)
            (include "enterprise.common.hasInitContainers" (merge (dict "component" $component) .))
        }}
      initContainers:
          {{- if include "enterprise.common.hasInitContainers" (merge (dict "component" $component) .) }}
          {{- include "enterprise.common.initContainers" (merge (dict "component" $component) .) | nindent 8 }}
          {{- end }}
          {{- include "enterprise.common.cloudsqlInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "enterprise.common.cloudsqlContainer" . | nindent 8 }}
        - name: wait-for-db
          image: {{ include "enterprise.common.image" . | trim }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
        {{- if or .Values.containerSecurityContext (index .Values $component).containerSecurityContext }}
          securityContext: {{- include "enterprise.common.containerSecurityContext" (merge (dict "component" $component) .) | nindent 12 }}
        {{- end }}
          envFrom: {{- include "enterprise.common.envFrom" (merge (dict "hook" true) .) | nindent 12 }}
          {{- /* environment carries extraEnv (the only cred source under injectSecretsViaEnv) and the DB encryption key */}}
          env: {{- include "enterprise.common.environment" (merge (dict "component" $component) .) | nindent 12 }}
          volumeMounts: {{- include "enterprise.common.extraVolumeMounts" (merge (dict "component" $component) .) | nindent 12 }}
            - name: config-volume
              mountPath: /config/config.yaml
              subPath: config.yaml
          {{- if .Values.certStoreSecretName }}
            - name: certs
              mountPath: /home/anchore/certs/
              readOnly: true
          {{- end }}
          {{- if eq (include "enterprise.common.readOnlyRootFilesystem" (merge (dict "component" $component) .)) "true" }}
          {{- include "enterprise.common.writableVolumeMounts" (merge (dict "component" $component) .) | nindent 12 }}
          {{- end }}
        {{- with .Values.preInstallJob.resources }}
          resources: {{- toYaml . | nindent 12 }}
        {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Fresh installs point at an as-yet-uninitialized database, so this
              # hook only waits for the database to become reachable (TCP). The
              # full pre-upgrade preflight (schema state, pg_cron, keyring) is
              # enforced by the pre-upgrade hooks, which run once the schema exists.
              #
              # Retry for up to ~5 minutes (30 attempts, 10s apart). This budget is
              # kept just inside Helm's default --timeout of 5m so that, if the
              # database never becomes reachable, the hook fails with its own error
              # rather than Helm aborting first.
              attempt=1
              max_attempts=30
              until (exec 3<>/dev/tcp/"${ANCHORE_DB_HOST}"/"${ANCHORE_DB_PORT}") 2>/dev/null; do
                if [ "${attempt}" -ge "${max_attempts}" ]; then
                  echo "Database ${ANCHORE_DB_HOST}:${ANCHORE_DB_PORT} still unreachable after ${max_attempts} attempts (~5m); giving up." >&2
                  exit 1
                fi
                echo "Database not reachable yet; attempt ${attempt}/${max_attempts}, retrying in 10s..."
                attempt=$((attempt + 1))
                sleep 10
              done
              echo "Database ${ANCHORE_DB_HOST}:${ANCHORE_DB_PORT} is reachable."
{{- end -}}
