{{- if and .Values.osaaMigrationJob.enabled .Values.osaaMigrationJob.rbacCreate (not .Values.osaaMigrationJob.serviceAccountName) -}}
{{- $component := "osaaMigrationJob" -}}
{{/*
RBAC for the object-store/analysis-archive migration job's scale-down init container.
Intentionally independent of the upgrade job's RBAC (upgrade_rbac.yaml): the migration job
is always a pre-upgrade hook and needs a ServiceAccount that can scale deployments down,
even when the upgrade job is disabled or configured to use the post-upgrade hook. Created at
hook-weight 0 so it exists before the migration job (hook-weight 1).
*/}}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "enterprise.fullname" . }}-osaa-migration-sa
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "enterprise.fullname" . }}-osaa-migration-role-binding
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "enterprise.fullname" . }}-osaa-migration-role
subjects:
  - kind: ServiceAccount
    name: {{ template "enterprise.fullname" . }}-osaa-migration-sa
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "enterprise.fullname" . }}-osaa-migration-role
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - watch
      - list
      - get
{{- end -}}
