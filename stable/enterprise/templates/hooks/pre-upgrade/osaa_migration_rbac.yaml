{{- if and .Values.osaaMigrationJob.enabled .Values.osaaMigrationJob.rbacCreate -}}
{{- $component := "osaaMigrationJob" -}}
{{/*
RBAC for the object-store/analysis-archive migration job's scale-down init container.
Intentionally independent of the upgrade job's RBAC (upgrade_rbac.yaml): the migration job
is always a pre-upgrade hook and needs a ServiceAccount that can scale deployments down,
even when the upgrade job is disabled or configured to use the post-upgrade hook. Created at
hook-weight 0 so it exists before the migration job (hook-weight 1).

rbacCreate=true: the chart owns the ServiceAccount, Role and RoleBinding. The ServiceAccount
is named after osaaMigrationJob.serviceAccountName when the user set one, otherwise a
generated name — and the RoleBinding always targets that same name, so the account the pod
runs as is the account that holds the permissions. Previously setting serviceAccountName
suppressed this whole file, leaving that account with no permission to scale anything down
while the migration ran against live services.

rbacCreate=false: nothing is created here and the account the job runs as is assumed to
already carry the permissions.
*/}}
{{- $serviceAccountName := include "enterprise.serviceAccountName" (merge (dict "component" $component) .) -}}
{{/*
Both this job and the upgrade job create their RBAC at hook-weight 0, so if they are pointed
at the same ServiceAccount name they would emit two ServiceAccount manifests with the same
name in the same hook phase. That happens to resolve — Helm's default before-hook-creation
policy makes the second delete and recreate the first — but it relies on duplicate hook
resources behaving benignly and deletes/recreates the account mid-phase. Emit the
ServiceAccount only once instead. The Role and RoleBinding below are always emitted, so the
shared account still ends up bound to both Roles and holds the union of the permissions.
*/}}
{{- $upgradeCreatesServiceAccount := and .Values.upgradeJob.enabled .Values.upgradeJob.rbacCreate (not .Values.upgradeJob.usePostUpgradeHook) -}}
{{- $serviceAccountAlreadyCreated := false -}}
{{- if $upgradeCreatesServiceAccount -}}
{{- $serviceAccountAlreadyCreated = eq $serviceAccountName (include "enterprise.serviceAccountName" (merge (dict "component" "upgradeJob") .)) -}}
{{- end -}}

{{- if not $serviceAccountAlreadyCreated }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "enterprise.fullname" . }}-osaa-migration-role-binding
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "enterprise.fullname" . }}-osaa-migration-role
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "enterprise.fullname" . }}-osaa-migration-role
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - watch
      - list
      - get
{{- end -}}
