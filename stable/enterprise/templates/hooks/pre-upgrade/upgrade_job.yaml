{{- if and .Values.upgradeJob.enabled (not .Values.upgradeJob.usePostUpgradeHook) -}}
{{- $component := "upgradeJob" -}}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "enterprise.upgradeJob.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
  {{- if not .Values.upgradeJob.force }}
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  # Fail the hook outright once the pod's own retry budget is exhausted;
  # do not let Kubernetes spin up fresh pods to retry (default backoffLimit
  # is 6, which would multiply the wait budget several times over).
  backoffLimit: 0
  {{- if ne (.Values.upgradeJob.ttlSecondsAfterFinished | quote) (-1 | quote) }}
  ttlSecondsAfterFinished: {{ .Values.upgradeJob.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      name: {{ template "enterprise.upgradeJob.fullname" . }}
      labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 8 }}
      annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 8 }}
    spec:
      {{- include "enterprise.common.podSpec" (merge (dict "component" $component) .) | indent 6 }}
      {{- include "enterprise.common.hostAliases" (merge (dict "component" $component) .) | nindent 6 }}
      restartPolicy: Never
      volumes: {{- include "enterprise.common.extraVolumes" (merge (dict "component" $component) .) | nindent 8 }}
        - name: config-volume
          configMap:
            name: {{ template "enterprise.hooks.fullname" . }}-config
      {{- with .Values.certStoreSecretName }}
        - name: certs
          secret:
            secretName: {{ . }}
      {{- end }}
      {{- if .Values.cloudsql.useExistingServiceAcc }}
        - name: {{ .Values.cloudsql.serviceAccSecretName }}
          secret:
            secretName: {{ .Values.cloudsql.serviceAccSecretName }}
      {{- end }}
      {{- if eq (include "enterprise.common.readOnlyRootFilesystem" (merge (dict "component" $component) .)) "true" }}
      {{- include "enterprise.common.writableVolumes" (merge (dict "component" $component) .) | nindent 8 }}
      {{- end }}
      {{- if or
            (eq (include "enterprise.appVersionChanged" .) "true")
            (and .Values.cloudsql.enabled .Values.cloudsql.useSideCar)
            (include "enterprise.common.hasInitContainers" (merge (dict "component" $component) .))
        }}
      initContainers:
      {{- if eq (include "enterprise.appVersionChanged" .) "true" }}
        - name: wait-for-db
          image: {{ include "enterprise.common.image" . | trim }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom: {{- include "enterprise.common.envFrom" (merge (dict "hook" true) .) | nindent 12 }}
          {{- /* environment carries extraEnv (the only cred source under injectSecretsViaEnv) and the DB encryption key */}}
          env: {{- include "enterprise.common.environment" (merge (dict "component" $component) .) | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /config/config.yaml
              subPath: config.yaml
          {{- if .Values.certStoreSecretName }}
            - name: certs
              mountPath: /home/anchore/certs/
              readOnly: true
          {{- end }}
          {{- if eq (include "enterprise.common.readOnlyRootFilesystem" (merge (dict "component" $component) .)) "true" }}
            {{- include "enterprise.common.writableVolumeMounts" (merge (dict "component" $component) .) | nindent 12 }}
          {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              CONNSTR=postgresql://"${ANCHORE_DB_USER}":"${ANCHORE_DB_PASSWORD}"@"${ANCHORE_DB_HOST}":"${ANCHORE_DB_PORT}"/"${ANCHORE_DB_NAME}"
              {{- if .Values.anchoreConfig.database.ssl }}
              CONNSTR=${CONNSTR}?sslmode={{ .Values.anchoreConfig.database.sslMode }}
              {{- with .Values.anchoreConfig.database.sslRootCertFileName }}
              CONNSTR=${CONNSTR}\&sslrootcert=/home/anchore/certs/{{ . }}
              {{- end }}
              {{- end }}
              # Wait for the database to pass the pre-upgrade check, gating on the
              # command's exit code (0 = ready to upgrade). Retry for up to ~5
              # minutes (30 attempts, 10s apart) to absorb transient startup (DB
              # not yet reachable, pg_cron launcher warm-up); a persistent failure
              # (e.g. pg_cron missing, keyring mismatch) exhausts the retries and
              # fails the hook with the real exit code instead of silently
              # proceeding. The budget is kept just inside Helm's default --timeout
              # of 5m so the hook's own error surfaces before Helm aborts.
              attempt=1
              max_attempts=30
              until anchore-enterprise-manager db --db-connect "${CONNSTR}" pre-upgrade-check; do
                rc=$?
                if [ "${attempt}" -ge "${max_attempts}" ]; then
                  echo "Pre-upgrade check still failing after ${max_attempts} attempts (~5m, last exit code ${rc}); giving up." >&2
                  exit "${rc}"
                fi
                echo "Pre-upgrade check did not pass yet (exit ${rc}); attempt ${attempt}/${max_attempts}, retrying in 10s..."
                attempt=$((attempt + 1))
                sleep 10
              done
              echo "Pre-upgrade check passed; database is ready to upgrade."
          {{- if or .Values.containerSecurityContext (index .Values $component).containerSecurityContext }}
          securityContext: {{- include "enterprise.common.containerSecurityContext" (merge (dict "component" $component) .) | nindent 12 }}
          {{- end }}
          {{- with .Values.upgradeJob.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: scale-down-anchore
          image: {{ include "enterprise.kubectl.image" . | trim }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              kubectl scale deployments --all --replicas=0 -l app.kubernetes.io/name={{ template "enterprise.fullname" . }};
              while [[ $(kubectl get pods -l app.kubernetes.io/name={{ template "enterprise.fullname" . }} --field-selector=status.phase=Running --no-headers | tee /dev/stderr | wc -l) -gt 0 ]]; do
                echo 'waiting for pods to go down...' && sleep 5;
              done
        {{- if or .Values.containerSecurityContext (index .Values $component).containerSecurityContext }}
          securityContext: {{- include "enterprise.common.containerSecurityContext" (merge (dict "component" $component) .) | nindent 12 }}
        {{- end }}
        {{- with .Values.upgradeJob.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if include "enterprise.common.hasInitContainers" (merge (dict "component" $component) .) }}
          {{- include "enterprise.common.initContainers" (merge (dict "component" $component) .) | nindent 8 }}
          {{- end }}
          {{- include "enterprise.common.cloudsqlInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "enterprise.common.cloudsqlContainer" . | nindent 8 }}
        - name: upgrade-enterprise-db
          image: {{ include "enterprise.common.image" . | trim }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
        {{- if or .Values.containerSecurityContext (index .Values $component).containerSecurityContext }}
          securityContext: {{- include "enterprise.common.containerSecurityContext" (merge (dict "component" $component) .) | nindent 12 }}
        {{- end }}
          envFrom: {{- include "enterprise.common.envFrom" (merge (dict "hook" true) .) | nindent 12 }}
          env: {{- include "enterprise.common.environment" (merge (dict "component" $component) .) | nindent 12 }}
          volumeMounts: {{- include "enterprise.common.extraVolumeMounts" (merge (dict "component" $component) .) | nindent 12 }}
            - name: config-volume
              mountPath: /config/config.yaml
              subPath: config.yaml
          {{- if .Values.certStoreSecretName }}
            - name: certs
              mountPath: /home/anchore/certs/
              readOnly: true
          {{- end }}
          {{- if eq (include "enterprise.common.readOnlyRootFilesystem" (merge (dict "component" $component) .)) "true" }}
          {{- include "enterprise.common.writableVolumeMounts" (merge (dict "component" $component) .) | nindent 12 }}
          {{- end }}
        {{- with .Values.upgradeJob.resources }}
          resources: {{- toYaml . | nindent 12 }}
        {{- end }}
          command: ["/bin/bash", "-c"]
          args:
          {{- if not .Values.anchoreConfig.database.ssl }}
            - |
              {{ print (include "enterprise.doSourceFile" .) }} anchore-enterprise-manager db --db-connect postgresql://"${ANCHORE_DB_USER}":"${ANCHORE_DB_PASSWORD}"@"${ANCHORE_DB_HOST}":"${ANCHORE_DB_PORT}"/"${ANCHORE_DB_NAME}" upgrade --dontask;
          {{- else if eq .Values.anchoreConfig.database.sslMode "require"}}
            - |
              {{ print (include "enterprise.doSourceFile" .) }} anchore-enterprise-manager db --db-use-ssl --db-connect postgresql://"${ANCHORE_DB_USER}":"${ANCHORE_DB_PASSWORD}"@"${ANCHORE_DB_HOST}":"${ANCHORE_DB_PORT}"/"${ANCHORE_DB_NAME}"?sslmode={{- .Values.anchoreConfig.database.sslMode }} upgrade --dontask;
          {{- else }}
            - |
              {{ print (include "enterprise.doSourceFile" .) }} anchore-enterprise-manager db --db-use-ssl --db-connect postgresql://"${ANCHORE_DB_USER}":"${ANCHORE_DB_PASSWORD}"@"${ANCHORE_DB_HOST}":"${ANCHORE_DB_PORT}"/"${ANCHORE_DB_NAME}"?sslmode={{- .Values.anchoreConfig.database.sslMode -}}\&sslrootcert=/home/anchore/certs/{{- .Values.anchoreConfig.database.sslRootCertFileName }} upgrade --dontask;
          {{- end }}
{{- end -}}
