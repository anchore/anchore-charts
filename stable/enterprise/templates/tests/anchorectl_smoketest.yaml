{{- $component := "smokeTest" -}}
{{- /* The smoke test reads ANCHORE_ADMIN_PASSWORD from the chart-managed secret via secretKeyRef.
       Under injectSecretsViaEnv the chart creates no such secret (creds are injected externally),
       so skip the test in that mode rather than reference a non-existent secret. */ -}}
{{- if not .Values.injectSecretsViaEnv -}}

apiVersion: v1
kind: Pod
metadata:
  name: "{{ template "enterprise.smokeTest.fullname" . }}"
  namespace: "{{ .Release.Namespace }}"
  labels: {{- include "enterprise.common.labels" (merge (dict "component" $component) .) | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" (merge (dict "component" $component "nil" true) .) | nindent 4 }}
    "helm.sh/hook": test
spec:
  volumes: {{- include "enterprise.common.volumes" . | nindent 2 }}
  - name: anchore-scratch
    emptyDir: {}
  {{- with .Values.imagePullSecretName }}
  imagePullSecrets:
    - name: {{ . }}
  {{- end }}
  {{- with (default .Values.nodeSelector (index .Values (print $component)).nodeSelector) }}
  nodeSelector: {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with (default .Values.affinity (index .Values (print $component)).affinity) }}
  affinity: {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with (default .Values.tolerations (index .Values (print $component)).tolerations) }}
  tolerations: {{- toYaml . | nindent 2 }}
  {{- end }}
  containers:
    - name: "anchorectl-smoketest"
      image: {{ include "enterprise.common.image" . | trim }}
      imagePullPolicy: {{ .Values.imagePullPolicy }}
    {{- with .Values.containerSecurityContext }}
      securityContext:
        {{ toYaml . | nindent 12 }}
    {{- end }}
      resources:
        requests:
          memory: "512Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
      envFrom: {{- include "enterprise.common.envFrom" . | nindent 6 }}
      env: {{- include "enterprise.common.environment" (merge (dict "component" $component) .) | nindent 6 }}
      - name: ANCHORECTL_URL
        value: {{ printf "http://%s:%v" (include "enterprise.api.fullname" .) .Values.api.service.port }}
      - name: ANCHORECTL_USERNAME
        value: "admin"
      - name: ANCHORECTL_ACCOUNT
        value: "admin"
      - name: ANCHORECTL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ ternary .Values.existingSecretName (include "enterprise.fullname" .) .Values.useExistingSecrets }}
            key: ANCHORE_ADMIN_PASSWORD

      command: ["/bin/bash", "-c"]
      args:
        - |
          # Wait for the system to report ready (services warm up at different rates).
          n=0
          until anchorectl system wait; do
            n=$((n + 1))
            if [ $n -ge 10 ]; then
              echo "system wait did not succeed after $n attempts. Exiting."
              exit 1
            fi
            echo "system wait attempt $n failed. Retrying in 30s..."
            sleep 30
          done
          echo "System is ready. Running smoke tests..."

          # Smoke tests can be transiently flaky right after readiness (feeds/data
          # still settling). Retry ONLY on failure — the release/deployment stays up
          # between attempts, so this just re-runs the tests against the same install.
          n=0
          until anchorectl system smoke-tests run; do
            n=$((n + 1))
            if [ $n -ge 3 ]; then
              echo "smoke tests still failing after $n attempts. Exiting."
              exit 1
            fi
            echo "smoke-tests attempt $n failed. Waiting 5m for the system to settle before retrying..."
            sleep 300
          done
          echo "Smoke tests passed."

      volumeMounts: {{- include "enterprise.common.volumeMounts" . | nindent 6 }}
  restartPolicy: Never
{{- end -}}