{{/*
Create a secret holding the database encryption keys when provided inline via
anchoreConfig.database.encryption.currentKey (and optional previousKey).
Skipped when an existingSecret is supplied or useExistingSecrets is true.
*/}}
{{- $enc := .Values.anchoreConfig.database.encryption -}}
{{- if and (not .Values.useExistingSecrets) (not .Values.anchoreConfig.database.disable_db_encryption_unsafe) (not $enc.existingSecret) $enc.currentKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "enterprise.fullname" . }}-db-encryption-keys
  namespace: {{ .Release.Namespace }}
  labels: {{- include "enterprise.common.labels" . | nindent 4 }}
  annotations: {{- include "enterprise.common.annotations" . | nindent 4 }}
type: Opaque
stringData:
  current_key: {{ $enc.currentKey | quote }}
  {{- with $enc.previousKey }}
  previous_key: {{ . | quote }}
  {{- end }}
{{- end -}}
