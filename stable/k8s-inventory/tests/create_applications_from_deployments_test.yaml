## k8sInventory.createApplicationsFromDeployments turns on the agent's create-applications-from-deployments
## setting. The agent then lists and watches Deployments and ReplicaSets, so the ClusterRole only gains
## list/watch on them while the setting is on; otherwise it keeps the get it needs for registration.
suite: Create Applications From Deployments Tests
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 9.9.9
  appVersion: 9.9.9
set:
  k8sInventory.anchore.url: http://anchore:8228
  k8sInventory.anchore.user: admin
  k8sInventory.anchore.password: pw

tests:
  - it: should render the setting as false by default
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^create-applications-from-deployments: false$"

  - it: should render the setting as true when enabled
    template: configmap.yaml
    set:
      k8sInventory.createApplicationsFromDeployments: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^create-applications-from-deployments: true$"

  - it: should only grant get on deployments and replicasets by default
    template: cluster-role-readonly.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["replicasets", "deployments"]
            verbs: ["get"]
      - lengthEqual:
          path: rules
          count: 2

  - it: should grant get, list and watch on deployments and replicasets when enabled
    template: cluster-role-readonly.yaml
    set:
      k8sInventory.createApplicationsFromDeployments: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["replicasets", "deployments"]
            verbs: ["get", "watch", "list"]
      - lengthEqual:
          path: rules
          count: 2

  - it: should keep the core rule unchanged when enabled
    template: cluster-role-readonly.yaml
    set:
      k8sInventory.createApplicationsFromDeployments: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods", "namespaces", "nodes"]
            verbs: ["get", "watch", "list"]
