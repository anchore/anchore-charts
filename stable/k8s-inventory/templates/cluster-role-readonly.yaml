apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8sInventory.fullname" . }}-read-only
  {{- if .Values.annotations }}
  annotations:
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  labels:
    {{- include "k8sInventory.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods","namespaces", "nodes"]
  verbs: ["get", "watch", "list"]
{{- $kinds := include "k8sInventory.createApplicationsFrom" . | fromJsonArray }}
- apiGroups: ["apps"]
  resources: ["replicasets", "deployments"]
  {{- if has "deployments" $kinds }}
  verbs: ["get", "watch", "list"]
  {{- else }}
  verbs: ["get"]
  {{- end }}
{{- $revisionKinds := list }}
{{- range (list "statefulsets" "daemonsets") }}
{{- if has . $kinds }}
{{- $revisionKinds = append $revisionKinds . }}
{{- end }}
{{- end }}
{{- if $revisionKinds }}
- apiGroups: ["apps"]
  resources: {{ append $revisionKinds "controllerrevisions" | toJson }}
  verbs: ["get", "watch", "list"]
{{- end }}
