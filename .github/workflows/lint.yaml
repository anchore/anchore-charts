name: "Lint changed charts using chart-testing tool"

on:
  pull_request:
    paths:
      - 'stable/**'

permissions:
  contents: read

jobs:
  lint:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      with:
        persist-credentials: false

    - name: Fetch history
      run: git fetch --prune --unshallow

    - name: Shellcheck
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

    - name: Set up chart-testing
      uses: helm/chart-testing-action@b43128a8b25298e1e7b043b78ea6613844e079b1 # v2.6.0

    - name: Run chart-testing (list-changed)
      id: list-changed
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        changed=$(ct list-changed --config 'ct-config.yaml' --target-branch "$BASE_REF")
        if [[ -n "$changed" ]]; then
          echo "CHANGED=true" >> "$GITHUB_OUTPUT"
        fi
        # A chart whose ONLY changed files live under its ci/ directory (test values)
        # doesn't need a chart version bump and shouldn't be version-checked. Collect
        # those names so the lint step below can exclude them.
        ci_only=""
        while IFS= read -r cp; do
          [[ -z "$cp" ]] && continue
          name="$(basename "$cp")"; path="stable/$name"
          files=$(git diff --name-only "origin/$BASE_REF...HEAD" -- "$path/")
          if [[ -n "$files" && -z "$(echo "$files" | grep -v "^$path/ci/" || true)" ]]; then
            echo "Skipping '$name': only ci/ files changed (no chart version bump required)"
            ci_only+="$name,"
          fi
        done <<< "$changed"
        echo "CI_ONLY_EXCLUDED=${ci_only%,}" >> "$GITHUB_OUTPUT"

    - name: Run chart-testing (lint)
      id: lint
      run: |
        EXCLUDE=""
        [[ -n "${{ steps.list-changed.outputs.CI_ONLY_EXCLUDED }}" ]] && EXCLUDE="--excluded-charts ${{ steps.list-changed.outputs.CI_ONLY_EXCLUDED }}"
        ct lint --config 'ct-config.yaml' $EXCLUDE
      if: steps.list-changed.outputs.CHANGED == 'true' && github.event.pull_request.base.ref == 'main'

    - name: Run chart-testing but skip version check (lint)
      id: lintskipversion
      run: ct lint --config 'ct-config.yaml' --check-version-increment=false
      if: steps.list-changed.outputs.CHANGED == 'true' && github.event.pull_request.base.ref != 'main'
